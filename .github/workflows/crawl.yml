name: Crawl sources

on:
  schedule:
    # Every 6 hours. Cron is UTC. Adjust as you like — GitHub Actions
    # cron on the free tier can lag a few minutes at busy times, that's fine.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "sources.yaml"    # re-crawl immediately when you edit your source list

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: python crawler/main.py

      - name: Commit updated data
        run: |
          git config user.name "curator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --quiet --cached || git commit -m "Update crawled data [skip ci]"
          git push
